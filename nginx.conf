server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /index.html {
        expires -1;
    }

    # This stable URL is resolved by the application at runtime. Revalidate it
    # on every deployment so an older Worklet cannot outlive a newer index.
    location = /assets/engine-audio-worklet.js {
        expires -1;
        try_files $uri =404;
    }

    # All other emitted assets carry a Vite content hash and are safe to cache.
    # Missing assets must remain 404s rather than falling through to the SPA.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
