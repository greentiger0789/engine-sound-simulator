<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-labelledby="title description">
  <title id="title">Ticket 15 fixed-condition spectrum comparison</title>
  <desc id="description">Baseline and changed intake and exhaust resonance spectra for a 6000 RPM equivalent pulse train at fixed opening, load, volume, seed, and sample rate.</desc>
  <rect width="820" height="340" fill="#fff" />
  <g stroke="#d7dce2" stroke-width="1">
    <path d="M60 40H770M60 84H770M60 128H770M60 172H770M60 216H770M60 260H770" />
  </g>
  <g stroke="#20262e" stroke-width="1.5" fill="none">
    <path d="M60 40V260H770" />
  </g>
  <g fill="#20262e" font-family="sans-serif" font-size="12">
    <text x="18" y="44">-70</text><text x="18" y="88">-75</text>
    <text x="18" y="132">-80</text><text x="18" y="176">-85</text>
    <text x="18" y="220">-90</text><text x="18" y="264">-95</text>
    <text x="65" y="280">50</text><text x="205" y="280">190</text>
    <text x="320" y="280">400</text><text x="445" y="280">1.2k</text>
    <text x="535" y="280">3.2k</text><text x="655" y="280">12k</text>
    <text x="735" y="280">22k Hz</text>
    <text x="330" y="315">frequency (log-spaced samples)</text>
    <text transform="translate(13 190) rotate(-90)">band energy (dB)</text>
  </g>
  <polyline points="70,113 120,162 220,90 285,126 335,96 410,107 460,112 550,108 670,69 750,70" fill="none" stroke="#1769aa" stroke-width="3" />
  <polyline points="70,120 120,223 220,194 285,197 335,110 410,104 460,86 550,104 670,72 750,73" fill="none" stroke="#d1495b" stroke-width="3" />
  <g fill="#20262e" font-family="sans-serif" font-size="12">
    <rect x="485" y="17" width="20" height="4" fill="#1769aa" /><text x="512" y="23">baseline: exhaust 78 Hz / intake 190 Hz</text>
    <rect x="485" y="34" width="20" height="4" fill="#d1495b" /><text x="512" y="40">changed: exhaust 286 Hz / intake 1200 Hz</text>
  </g>
</svg>
